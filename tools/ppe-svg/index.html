<html lang="en">

<style>

<h1>PPE icons · flat vector</h1>
<p>Source: <code>src/render/ppe-icons.ts</code>. <button id="save">Save SVGs to assets/ppe/</button> <span id="log"></span></p>

<div class="row dark" id="dark"></div>

<div class="row" id="power"></div>

<script type="module" src="./main.ts"></script>
